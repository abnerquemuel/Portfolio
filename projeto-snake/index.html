<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="game">
      <header class="game-header">
        <div>
          <h1>Snake</h1>
          <span>Placar: <strong id="score">0</strong></span>
        </div>
        <button type="button" id="playButton">Jogar</button>
      </header>

      <canvas id="board" width="480" height="480" aria-label="Tabuleiro do jogo Snake"></canvas>

      <div class="controls" aria-label="Controles">
        <button type="button" data-direction="up">↑</button>
        <div>
          <button type="button" data-direction="left">←</button>
          <button type="button" data-direction="down">↓</button>
          <button type="button" data-direction="right">→</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
